<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Өткізу бекеті | Digital Temirzhol</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--bg-app); }
    .go-wrap { max-width: 520px; margin: 0 auto; padding: 0 0 32px; }
    .go-head { background: #fff; border-bottom: 2px solid var(--border-strong); padding: 20px 20px 16px; }
    .go-head h1 { font-size: 22px; font-weight: 800; }
    .go-point {
      font-size: 14px; font-weight: 700; background: var(--primary-light); color: var(--primary);
      display: inline-block; padding: 6px 12px; border-radius: 6px; margin-top: 8px;
      border: 1px solid #c3d4ea;
    }
    .go-body { padding: 16px 16px 0; }
    .go-cam {
      position: relative; background: #0f172a; border: 1px solid var(--border-strong); border-radius: 10px;
      overflow: hidden; height: 320px; margin-bottom: 12px;
    }
    .go-cam video { width: 100%; height: 100%; object-fit: cover; }
    .go-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
    .go-btns .btn { padding: 20px 8px; font-size: 18px; }
    .go-result {
      display: none; background: #fff; border: 1px solid var(--border-strong);
      border-left: 4px solid var(--success);
      border-radius: 8px; padding: 12px 16px; font-weight: 700; font-size: 15px; margin-bottom: 12px;
    }
    .go-result.err { border-left-color: var(--danger); }
    .go-foot { text-align: center; margin-top: 14px; }
    .go-foot a { color: var(--primary); font-size: 14px; font-weight: 700; }
    @media (max-width: 480px) {
      .go-btns { grid-template-columns: 1fr; }
      .go-cam { height: 260px; }
    }
  </style>
</head>
<body>

  <div class="go-wrap">
    <div class="rail-stripe"></div>
    <div class="go-head">
      <h1>ӨТКІЗУ БЕКЕТІ</h1>
      <div style="font-size: 12.5px; color: var(--text-muted); font-weight: 700;">DIGITAL TEMIRZHOL • ФОТОТІРКЕУ</div>
      <span class="go-point" id="goPoint">БЕКЕТ АНЫҚТАЛУДА...</span>
    </div>

    <div class="go-body">
      <div id="goLoginBar" style="display:none; background:#fff; border:1px solid var(--border-strong); border-left:4px solid var(--primary); border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:14px;">
        Өз атыңыздан өту үшін <a id="goLoginLink" href="login.html" style="color:var(--primary); font-weight:700;">кіріңіз</a>
      </div>

      <div class="go-cam">
        <video id="goVideo" autoplay playsinline muted></video>
        <canvas id="goCanvas" style="display:none;"></canvas>
        <div class="scanline"></div>
        <div style="position:absolute; top:10px; left:12px; display:flex; align-items:center; gap:8px;">
          <span class="live-dot"></span>
          <span style="color:#fff; font-size:12px; font-weight:700;">КАМЕРА</span>
        </div>
      </div>

      <div id="goGuestBox">
        <input type="text" id="goName" class="form-control" placeholder="Аты-жөніңіз (ФИО)" autocomplete="off"
               style="background:#fff; margin-bottom:4px;">
      </div>

      <div class="go-btns">
        <button class="btn btn-success" id="goIn" onclick="goCheck('CHECK_IN')">КІРДІМ</button>
        <button class="btn btn-danger" id="goOut" onclick="goCheck('CHECK_OUT')">ШЫҚТЫМ</button>
      </div>

      <div class="go-result" id="goResult"></div>

      <div class="go-foot">
        <a href="index.html">Толық сайтқа өту →</a>
      </div>
    </div>
    <div class="rail-stripe" style="margin-top:20px;"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    const _p = new URLSearchParams(window.location.search);
    const checkpointId = _p.get("c") || "";
    let stream = null;
    const video = document.getElementById("goVideo");

    function say(text, isErr) {
      const r = document.getElementById("goResult");
      r.style.display = "block";
      r.classList.toggle("err", !!isErr);
      r.textContent = text;
    }

    async function init() {
      // Identity: locked when logged in
      const u = Api.getUser();
      if (u && u.full_name) {
        document.getElementById("goGuestBox").style.display = "none";
      } else {
        const bar = document.getElementById("goLoginBar");
        bar.style.display = "block";
        document.getElementById("goLoginLink").href =
          "login.html?next=" + encodeURIComponent("go.html" + window.location.search);
      }
      // Checkpoint name
      if (checkpointId) {
        try {
          const points = await Api.getWorkPoints("checkpoint", true);
          const cp = points.find(p => String(p.id) === String(checkpointId));
          if (cp) document.getElementById("goPoint").textContent = cp.name.toUpperCase();
          else document.getElementById("goPoint").textContent = "КПП";
        } catch (e) {
          document.getElementById("goPoint").textContent = "КПП";
        }
      } else {
        document.getElementById("goPoint").textContent = "КПП";
      }
      // Camera
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (e) {
        say("Камера қосылмады: рұқсат беріңіз", true);
      }
    }

    async function goCheck(action) {
      const btnIn = document.getElementById("goIn");
      const btnOut = document.getElementById("goOut");
      btnIn.disabled = true;
      btnOut.disabled = true;
      try {
        let photo = null;
        if (video.videoWidth) {
          const c = document.getElementById("goCanvas");
          c.width = video.videoWidth;
          c.height = video.videoHeight;
          c.getContext("2d").drawImage(video, 0, 0, c.width, c.height);
          photo = c.toDataURL("image/jpeg", 0.85);
        }
        const u = Api.getUser();
        const name = (document.getElementById("goName").value || "").trim();
        const res = await Api.checkIn({
          worker_name: (u && u.full_name) || name || "Жұмысшы",
          user_id: u ? u.id : null,
          photo_base64: photo,
          action_type: action,
          checkpoint_id: checkpointId ? parseInt(checkpointId) : undefined,
          kiosk_token: undefined
        });
        say((action === "CHECK_IN" ? "КІРДІҢІЗ ✓ " : "ШЫҚТЫҢЫЗ ✓ ") + (res.timestamp || ""), false);
      } catch (err) {
        say("Қате: " + (err.message || "сервер жауап бермеді"), true);
      } finally {
        btnIn.disabled = false;
        btnOut.disabled = false;
      }
    }

    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
