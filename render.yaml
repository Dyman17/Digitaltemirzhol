# Render Blueprint: https://render.com/docs/blueprint-spec
# Деплой в 1 клик: Render Dashboard -> New -> Blueprint -> выбрать этот репозиторий.
# Создаст: Postgres + API (монолит: API + фронтенд) + отдельный статический фронтенд.
databases:
  - name: digitaltemirzhol-db
    databaseName: digitaltemirzhol
    user: digitaltemirzhol
    plan: free

services:
  # --- Backend API (заодно раздаёт frontend по тому же URL) ---
  - type: web
    name: digitaltemirzhol-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # seed_roles.py идемпотентен: создаёт boss/dispatcher/master/worker один раз
    startCommand: "python seed_roles.py; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: digitaltemirzhol-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: dt-storage
      mountPath: /opt/render/project/src/backend/storage
      sizeGB: 1

  # --- Отдельный статический фронтенд (опционально; API_URL = URL сервиса выше) ---
  # После первого деплоя API вставьте его URL в env API_URL этого сайта.
  - type: web
    name: digitaltemirzhol-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: 'if [ -n "$API_URL" ]; then echo "window.DT_API_BASE=\"$API_URL\";" > js/config.js; fi'
    staticPublishPath: ./
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        value: https://digitaltemirzhol-api.onrender.com
