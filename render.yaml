# Render Blueprint: https://render.com/docs/blueprint-spec
# Деплой в 1 клик: Render Dashboard -> New -> Blueprint -> выбрать этот репозиторий.
# Создаст: Postgres + API (монолит: API + фронтенд на одном URL).
databases:
  - name: digitaltemirzhol-db
    databaseName: digitaltemirzhol
    user: digitaltemirzhol
    plan: free

services:
  # --- Backend API (заодно раздаёт frontend по тому же URL) ---
  - type: web
    name: digitaltemirzhol-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    # seed_roles.py идемпотентен: создаёт boss/dispatcher/master/worker один раз
    startCommand: "python seed_roles.py; uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: digitaltemirzhol-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
    # NOTE: persistent disk убран — на free-тарифе диски запрещены.
    # Загруженные фото/PDF живут до перезапуска сервиса (для диплома ок;
    # для продакшена нужен платный план + disk или S3-совместимое хранилище).
# Отдельный статический фронтенд на Render НЕ создаём (free-план его не принимает):
# API-монолит уже раздаёт frontend по своему URL, а внешний статик живёт на Vercel
# (там API_URL прописывается в env на стороне Vercel).
